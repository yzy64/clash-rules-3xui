mixed-port: 7897
allow-lan: true
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
# ============================================================
# Clash DNS 精简版(适用于 Mihomo / Clash.Meta 内核)
# 思路:fake-ip 接管 + 国内域名走国内 DNS + 境外域名走境外 DoH
#       用 nameserver-policy 分流,取代 fallback / fallback-filter
# ============================================================
dns:
  enable: true
  listen: 127.0.0.1:5335
  ipv6: false                      # 没有 IPv6 环境就关掉,减少无效查询

  # ---------- 优先读取 hosts(命中后直接返回,不再走 DNS 解析) ----------
  use-hosts: true                  # 读取配置文件顶层 hosts: 段(见文件末尾示例)
  use-system-hosts: true           # 读取系统 hosts 文件
                                   #   Windows: C:\Windows\System32\drivers\etc\hosts
                                   #   Linux/macOS/OpenWrt: /etc/hosts

  # ---------- Fake-IP ----------
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist   # 列表内的域名返回真实 IP,其余返回假 IP

  # ---------- 引导 DNS:只用来解析下面 DoH 服务器自己的域名,必须是纯 IP ----------
  default-nameserver:
    - 223.5.5.5                    # 阿里
    - 119.29.29.29                 # 腾讯 DNSPod

  # ---------- 默认 DNS:国内 DoH(未命中 policy 的域名都走这里) ----------
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # ---------- 分流策略:按域名指定 DNS ----------
  nameserver-policy:
    "geosite:cn,private":          # 国内域名 & 内网域名 -> 国内 DNS
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":     # 境外域名 -> 境外 DoH
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query

  # ---------- 以下域名不使用假 IP(需要真实 IP 才能正常工作) ----------
  fake-ip-filter:
    # 局域网 / 内网
    - "*.lan"
    - "*.local"
    - "geosite:private"
    # 联网检测(Windows / Android / iOS 等)
    - "geosite:connectivity-check"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    # NTP 对时
    - "geosite:category-ntp"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "*.ntp.org.cn"
    - "pool.ntp.org"
    - "+.pool.ntp.org"
    # STUN / P2P / 语音视频
    - "stun.*.*"
    - "stun.*.*.*"
    # 游戏主机联机 / NAT 检测
    - "*.*.*.srv.nintendo.net"
    - "*.*.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    # 英雄联盟测速
    - "speedtest.cros.wr.pvp.net"
    # QQ 本地登录回调
    - "localhost.ptlogin2.qq.com"
    # 音乐类(播放器依赖真实 IP,常见的几家)
    - "+.music.163.com"
    - "+.126.net"
    - "+.y.qq.com"
    - "+.music.tc.qq.com"
    - "+.stream.qqmusic.qq.com"
    - "+.kugou.com"
    - "+.kuwo.cn"
    - "+.music.migu.cn"
    - "+.joox.com"

# ============================================================
# 可选:自定义 hosts(注意:这是顶层字段,和 dns: 同级,不要缩进到 dns 下面)
# 需要 dns.use-hosts: true 才会生效
# ============================================================
# hosts:
#   router.lan: 192.168.1.1
#   nas.lan: 192.168.1.10
#   "*.dev.local": 127.0.0.1
#   "+.example.com": 10.0.0.5


profile:
  store-selected: true
  store-fake-ip: false
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443, 8443]

