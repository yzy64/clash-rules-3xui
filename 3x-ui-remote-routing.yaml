# 3x-ui Remote Routing（全局路由规则）专用模板
# 按 hrules 的写法对齐：proxy-groups 用 include-all / include-all-proxies，
# 由 Mihomo 自动读取面板里的真实节点；dns / sniffer 两段需要面板里打开
# “Use DNS from remote rules” 才会一起下发
# 使用方法：把这个文件传到 GitHub（或 Gist），用 Raw URL 填到
# 3x-ui 面板 → 面板设置 → 订阅设置 → Clash / Mihomo → 启用路由 → 全局路由规则，
# 然后在 Clash Verge / 手机 Clash Meta 里更新订阅

dns:
  enable: true
  listen: 127.0.0.1:5335
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "geosite:private"
    - "geosite:connectivity-check"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "geosite:category-ntp"
    - "time.*.com"
    - "time.*.gov"
    - "ntp.*.com"
    - "*.ntp.org.cn"
    - "pool.ntp.org"
    - "+.pool.ntp.org"
    - "stun.*.*"
    - "stun.*.*.*"
    - "*.*.*.srv.nintendo.net"
    - "*.*.stun.playstation.net"
    - "xbox.*.*.microsoft.com"
    - "*.*.xboxlive.com"
    - "speedtest.cros.wr.pvp.net"
    - "localhost.ptlogin2.qq.com"
    - "+.music.163.com"
    - "+.126.net"
    - "+.y.qq.com"
    - "+.music.tc.qq.com"
    - "+.stream.qqmusic.qq.com"
    - "+.kugou.com"
    - "+.kuwo.cn"
    - "+.music.migu.cn"
    - "+.joox.com"

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    QUIC:
      ports: [443, 8443]

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies: ["⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "⚡ 自动选择"
    type: url-test
    include-all: true
    exclude-filter: ^DIRECT$|剩余|到期|有效期|官网|官方|traffic|remaining|expire|expiry|quota|bandwidth|website|homepage
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    lazy: false
    tolerance: 0
  - name: "🛑 广告拦截"
    type: select
    proxies: [REJECT, DIRECT, "🚀 节点选择"]
    include-all-proxies: true
  - name: "🤖 AI 服务"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "📹 油管视频"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "🔍 谷歌服务"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "Ⓜ️ 微软服务"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "🍏 苹果服务"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "📲 电报消息"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "🐱 代码托管"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "🏠 私有网络"
    type: select
    proxies: [DIRECT, REJECT, "🚀 节点选择", "⚡ 自动选择"]
    include-all-proxies: true
  - name: "🔒 国内服务"
    type: select
    proxies: [DIRECT, REJECT, "🚀 节点选择", "⚡ 自动选择"]
    include-all-proxies: true
  - name: "🌍 非中国"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true
  - name: "🐟 漏网之鱼"
    type: select
    proxies: ["🚀 节点选择", "⚡ 自动选择", DIRECT, REJECT]
    include-all-proxies: true

